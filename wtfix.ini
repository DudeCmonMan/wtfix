; wtfix: 1 on, 0 off. A fix turns itself off when a game update changes what it patches (see logs\wtfix.log).
[fixes]
nearestcell=1
savelist=1
; Load Game: autosaves sorted with the other saves, newest first.
savesort=1
gcload=1
splinecopy=1
consts=1
battleblur=1
battlefog=1
battlesound=1
; Battle props: off-screen ones culled, tiny ones not drawn ([perf]).
battlecull=1
friendlyview=1
unithud=1
live=1
; The in-game settings panel (Insert).
overlay=1
; The game's per-frame Steam DLC check, once a second instead.
dlccheck=1
; Battle sun shadows: static casters redrawn only when they or the light change ([perf] shadow_cache).
shadowcache=1
; Camera-facing effect planes kept while the camera holds still ([perf] fx_lookat_cache).
fxlookat=1
; Unit skins: joints computed in C, armour and clothes once a frame ([perf]).
subskin=1
; NVIDIA DLSS or AMD FSR 3.1 in place of the game's TAA ([upscaler]; wtdlss.dll with nvngx_dlss.dll, wtfsr.dll).
dlss=1
; The main render pass drawn by the main thread and worker threads together ([perf] draw_threads).
deferdraw=1

[ui]
; The settings panel's size (Insert), 0.5 to 2.
panel_scale=1
; HUDs over battle units, times the UI scaling option (1 = the game's size).
unit_hud_scale=0.8 ; the full HUD with the name (hover, ALT, Shift+ALT, deployment)
unit_bars_scale=1 ; the small health bars shown otherwise

[gc]
; The GC collects after allocating t/(1-t) x the live data; load_threshold applies while loading. Capped at 0.9.
threshold=0.2
load_threshold=0.5

[perf]
; 1 culls static battle props off screen; props smaller than this many pixels are not drawn (0: off).
cull_offscreen_props=1
cull_small_props_px=6
; 1 keeps the static casters' shadow map; the margin (% of the shadow box per side) trades sharpness for fewer redraws.
shadow_cache=1
shadow_cache_margin=5
; 1 skips recomputing camera-facing effect planes while nothing moves; same picture.
fx_lookat_cache=0
; 1 computes armour and clothes joints once a frame unless what they follow changed.
subskin_once=1
; 1 computes skin joint matrices in C with the game's operation order; same results.
skin_joints_c=1
; Worker threads that help the main thread draw the main pass, 0 to 7 (0: off); same picture.
draw_threads=3

[upscaler]
; 1 replaces the game's own TAA (light: edges stay mostly aliased) with the upscaler; needs the game's AA option on.
enable=1
; 0 NVIDIA DLSS, 1 AMD FSR 3.1; GPUs that can't run DLSS (AMD, Intel, NVIDIA before RTX) use FSR.
upscaler=0
; 0 DLAA or FSR's Native AA (anti-aliasing only), 1 Quality, 2 Balanced, 3 Performance, 4 Ultra performance.
mode=1
; DLSS: 1 keeps the game's sharpen filter (DLSS has no sharpening of its own).
dlss_sharpen=0
; FSR: its own sharpening, 0 off to 1 strongest.
fsr_sharpness=0
; 1: the upscalers' texture LOD bias (sharper textures); 0: the game's.
mip_bias=1

[cpu]
; auto: the CPUs sharing the largest L3 (an X3D's V-Cache die); N: cache group N (see logs\wtfix.log); off: Windows.
die=auto

[const]
; Game constants (data.cdb, constant sheet), Name=number; the game's own value after the ;.
CameraMaxDistance=80 ; 40, battle camera zoom-out limit and starting distance
