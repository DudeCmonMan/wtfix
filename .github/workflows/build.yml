name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -I tools/privacy_check.py --all

  build:
    needs: privacy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # NVIDIA DLSS SDK at a pinned commit, every file checked by SHA-256.
      - run: python -I tools/get_dlss_sdk.py sdk
      # AMD's FidelityFX SDK, MapleHinata's D3D11 fork, at a pinned commit, every file checked by SHA-256.
      - run: python -I tools/get_fsr_sdk.py fsr-sdk

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
          DLLTOOL: dlltool
        run: VERSION="$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA::7}")" sh package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wtfix-${{ github.sha }}
          path: dist/*.zip

  # A version tag drafts a release with the zip; it is published by hand after its notes are written.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wtfix-${{ github.sha }}
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "wtfix $GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_REF_NAME ($GITHUB_SHA). Drag and drop the zip's contents into your Wartales folder; see the README."
