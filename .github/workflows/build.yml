name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -I tools/privacy_check.py --all

  build:
    needs: privacy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # NVIDIA DLSS SDK at a pinned commit, every file checked by SHA-256.
      - run: python -I tools/get_dlss_sdk.py sdk

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
          DLLTOOL: dlltool
        run: VERSION="${GITHUB_SHA::7}" sh package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wtfix-${{ github.sha }}
          path: dist/*.zip
